    <g>
      <rect x="252" y="36" width="168" height="148" rx="14" fill="#182018" stroke="#c6ff00" stroke-opacity="0.45"/>
      <text x="336" y="78" fill="#c6ff00" font-size="13" font-weight="700">2</text>
      <text x="336" y="108" fill="#f4f7fb" font-size="15" font-weight="700">ITF</text>
      <text x="336" y="132" fill="#c9d2dc" font-size="12">World Tennis</text>
      <text x="336" y="150" fill="#c9d2dc" font-size="12">Tour</text>
    </g>
    <g>
      <rect x="472" y="36" width="168" height="148" rx="14" fill="#182018" stroke="#c6ff00" stroke-opacity="0.45"/>
      <text x="556" y="78" fill="#c6ff00" font-size="13" font-weight="700">3</text>
      <text x="556" y="108" fill="#f4f7fb" font-size="15" font-weight="700">Challenger</text>
      <text x="556" y="132" fill="#c9d2dc" font-size="12">y WTA 125</text>
    </g>
    <g>
      <rect x="692" y="36" width="164" height="148" rx="14" fill="#182018" stroke="#c6ff00"/>
