# Sitio estático. El comando de build se deja vacío a propósito.
[build]
  publish = "public"
  command = ""

# www → apex. No afecta a la URL *.netlify.app.
[[redirects]]
  from = "https://www.acearena.io/*"
  to = "https://acearena.io/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.pdf"
  [headers.values]
    Content-Disposition = "inline"
