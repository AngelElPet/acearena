# Sitio estático. GitHub Actions regenera public/ y lo commitea. Netlify no ejecuta build.
[build]
  publish = "public"
  command = ""

# www → apex. No afecta a la URL *.netlify.app.
[[redirects]]
  from = "https://www.acearena.io/*"
  to = "https://acearena.io/:splat"
  status = 301
  force = true

# Las páginas de noticias, resultados y legales son ficheros reales.
# No reescribir todas las rutas a index.html.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/art/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.pdf"
  [headers.values]
    Content-Disposition = "inline"

[[headers]]
  for = "/dossier/*"
  [headers.values]
    X-Robots-Tag = "noindex"
